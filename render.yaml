# Render Blueprint: one web service (Docker) + one Postgres instance.
# "New +" -> "Blueprint" in the Render dashboard, point it at this repo.
databases:
  - name: acme-salary-db
    plan: free
    databaseName: acme_salary
    user: acme

services:
  - type: web
    name: acme-salary-manager
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: acme-salary-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: SEED_ON_BOOT
        value: "1"
      - key: RAILS_LOG_LEVEL
        value: info
      - key: WEB_CONCURRENCY
        value: "1"
